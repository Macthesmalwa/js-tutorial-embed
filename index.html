  <!-- INTERNAL CSS -->
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      background-color: #1e293b;
      border-radius: 12px;
      padding: 24px;
      max-width: 800px;
      width: 100%;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }

    h1 {
      font-size: 1.4rem;
      margin-bottom: 15px;
      color: #38bdf8;
    }

    /* 16:9 Aspect Ratio */
    .video-wrapper {
      position: relative;
      padding-bottom: 56.25%;
      height: 0;
      overflow: hidden;
      border-radius: 8px;
    }

    .video-wrapper iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .controls {
      margin-top: 15px;
      display: flex;
      gap: 10px;
    }

    button {
      background-color: #0284c7;
      color: #fff;
      border: none;
      padding: 10px 16px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background-color: #0369a1;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>JavaScript Tutorial #1 - CodeWithHarry</h1>

    <!-- YOUTUBE IFRAME -->
    <div class="video-wrapper">
      <iframe 
        id="player"
        src="https://www.youtube.com/embed/ER9SspLe4Hg" 
        title="JavaScript Tutorial #1"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
        allowfullscreen>
      </iframe>
    </div>

    <div class="controls">
      <button onclick="jumpTo(430)">Jump to Console Demo (7:10)</button>
      <button onclick="jumpTo(570)">Jump to Code Example (9:30)</button>
    </div>
  </div>

  <!-- INTERNAL JAVASCRIPT -->
  <script>
    function jumpTo(seconds) {
      const player = document.getElementById('player');
      player.src = "https://www.youtube.com/embed/ER9SspLe4Hg?start=" + seconds + "&autoplay=1";
    }
  </script>

</body>
